name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # matches the Dockerfile's base image
      - run: pip install Pillow==11.3.0 pytest ruff
      - run: ruff check .
      - run: pytest -q

  web:
    name: Web — lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22                # matches the Dockerfile's build stage
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build does not catch an undefined name; lint does.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    name: Image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # From a clean checkout, so a file that was never committed fails here
      # rather than on the server.
      - run: docker build -t pick:ci .
      - name: Container starts and answers
        run: |
          mkdir -p "$RUNNER_TEMP/datasets"
          docker run -d --name smoke -p 8800:8800 \
            -v "$RUNNER_TEMP/datasets:/data/datasets:ro" pick:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8800/api/versions; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
