name: Feature request
description: Suggest something Pick should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Rough is fine.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Files
        - Review
        - Fix
        - Stats
        - Download / export
        - Server or deployment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Any workaround you use now, if there is one.
