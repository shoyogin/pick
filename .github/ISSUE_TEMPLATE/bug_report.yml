name: Bug report
description: Something in the dataset browser does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Review, version online/t0.0.0, split train
        2. Open an image and press 2
        3. …
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Files
        - Review
        - Fix
        - Stats
        - Download / export
        - Login or reviewer name
        - Server or deployment
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dataset version
      description: As shown in the version picker, if it matters.
      placeholder: online/t0.0.0

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 131 on Ubuntu

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The relevant lines from `docker compose logs browser` (or `caddy`), if any.
      render: shell

  - type: checkboxes
    id: secrets
    attributes:
      label: Before submitting
      options:
        - label: I have removed passwords, password hashes and the contents of `caddy.env` / `.env` from everything above.
          required: true
